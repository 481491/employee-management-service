spring:
  application:
    name: employee-management-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/employee_management}
    username: ${SPRING_DATASOURCE_USERNAME:emp_user}
    password: ${SPRING_DATASOURCE_PASSWORD:emp_man_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        order_updates: true

  sql:
    init:
      mode: always
  cloud:
    function:
      definition: transactionOutBoxConsumer
    stream:
      kafka:
        binder:
          brokers: ${SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS:localhost:9093}
        bindings:
          transactionOutBoxConsumer-in-0:
            consumer:
              startOffset: earliest
              enable-dlq: true
              dlq-name: transaction-created-dlq
      bindings:
        # StreamBridge alternative:
        # orderProducer-out-0:
        #   destination: orders
        #   content-type: application/json
        # Spring Cloud Stream alternative:
        # orderConsumer-in-0:
        #   destination: orders
        #   group: order-consumers
        #   content-type: application/json
        transactionOutBoxConsumer-in-0:
          destination: outbox.event.TRANSACTION
          group: 1
          content-type: application/json
          consumer:
            max-attempts: 3
  cache:
    type: redis
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
