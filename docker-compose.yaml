services:
  database:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=emp_user
      - POSTGRES_PASSWORD=emp_man_password
      - POSTGRES_DB=employee_management
    ports:
      - '5433:5432'
    command: [ "postgres", "-c", "wal_level=logical" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emp_user -d employee_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  zookeeper:
    image: zookeeper:3.9.0
    ports:
      - 2181:2181
      - 2888:2888
      - 3888:3888
  kafka:
    image: docker.io/bitnamilegacy/kafka:3.4
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_LISTENERS: INTERNAL://:9092,EXTERNAL://:9093
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      - zookeeper
  connect:
    image: debezium/connect:2.4.0.Final
    ports:
      - 8083:8083
      - 8778:8778
    links:
      - kafka
      - database
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=debezium-events
      - CONFIG_STORAGE_TOPIC=debezium_configs
      - OFFSET_STORAGE_TOPIC=debezium_offsets
      - STATUS_STORAGE_TOPIC=debezium_statuses
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_ZOOKEEPER=zookeeper:2181
      - KAFKA_CLUSTERS_0_SCHEMA_REGISTRY=http://localhost:8081
      - SPRING_PROFILES_ACTIVE=prod
    ports:
      - "9001:8080"
    depends_on:
      - kafka
  debezium-ui:
    image: debezium/debezium-ui:2.4
    platform: linux/amd64
    environment:
      - KAFKA_CONNECT_URIS=http://connect:8083  # Pointing to Kafka Connect service
    ports:
      - 9091:8080
    depends_on:
      - connect
  setup-debezium-connector:
    image: curlimages/curl
    depends_on:
      - connect
    links:
      - connect
    environment:
      DEBEZIUM_CONFIG: |
        {
          "name": "postgresql-connector",
          "config": {
            "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
            "connector.displayName": "PostgreSQL",
            "topic.prefix": "pg-changes",
            "database.user": "emp_user",
            "database.dbname": "employee_management",
            "table.exclude.list": "audit",
            "database.hostname": "database",
            "database.password": "emp_man_password",
            "name": "postgresql-connector",
            "connector.id": "postgres",
            "plugin.name": "pgoutput",
            "slot.name": "employee_management_outbox_slot"
          } 
        }
    command: >
      sh -c "
        sleep 10;
        echo Waiting for Kafka Connect to start listening on connect:8083...;
        while ! nc -z connect 8083;
        do
          sleep 1;
        done;
        echo Kafka Connect is up!;
        echo $$DEBEZIUM_CONFIG > /tmp/debezium-connector-config.json
        curl -X POST -H \"Content-Type: application/json\" --data @/tmp/debezium-connector-config.json http://connect:8083/connectors;
      "
  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    image: ems-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/employee_management
      SPRING_DATASOURCE_USERNAME: emp_user
      SPRING_DATASOURCE_PASSWORD: emp_man_password
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: kafka:9092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_healthy